# Builds microsoft.robbyj.dev (home page at /, redesigns at /main, …) and publishes it to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but never cancels one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install the redesign's dependencies
        run: npm ci --prefix website

      # Reports where Pages serves the site: '/microsoft-redesign' on robbidev.github.io,
      # or '' once the custom domain (microsoft.robbyj.dev) is connected.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build the site into dist/
        run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
